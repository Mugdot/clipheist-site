# One-click deploy for Render: https://render.com/deploy?repo=https://github.com/Mugdot/clipheist-site
services:
  - type: web
    name: clipheist-site
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SITE_URL
        value: https://mugdot.github.io/clipheist
      - key: INSTALLER_URL
        value: https://github.com/Mugdot/clipheist-download/releases/latest/download/ClipHeist-Setup.exe
      - key: SUPPORT_EMAIL
        value: boneboxgame@gmail.com
      - key: MAX_DEVICES
        value: "2"
      # Secrets: Render asks you to type these in when you deploy. Copy them from your local .env file.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: DOWNLOAD_SECRET
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      # Add later in the Render dashboard (Environment tab) when you set up email:
      # STRIPE_WEBHOOK_SECRET, RESEND_API_KEY, EMAIL_FROM
